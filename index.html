<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mentalist | Personal Casebook</title>
<style>
:root {
  --bg:#171417;
  --panel:#211c20;
  --panel2:#292126;
  --red:#9e3d4d;
  --red2:#c15a66;
  --gold:#d8b783;
  --cream:#f2e8da;
  --muted:#b0a1a5;
  --border:#403037;
  --green:#7db59a;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
  min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1050px;margin:auto;padding:34px 23px 55px}
header{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;padding-bottom:22px;border-bottom:1px solid var(--border)
}
.brand{display:flex;align-items:center;gap:12px}
.smiley{
  display:grid;place-items:center;width:45px;height:45px;
  border-radius:50%;background:var(--red);color:#fff0df;
  font-family:Arial,sans-serif;font-size:28px;
  box-shadow:0 0 24px #9e3d4d30
}
.brand-name{font-size:19px;letter-spacing:1px}
.brand-sub{
  display:block;color:var(--gold);font:10px Arial,sans-serif;
  letter-spacing:2px;margin-top:5px
}
.date{font:12px Arial,sans-serif;color:var(--muted);text-align:right}
.hero{
  margin:28px 0 24px;padding:30px 28px;
  border:1px solid #70404b;border-radius:14px;
  background:linear-gradient(115deg,#382128,#241d23 68%,#292126);
  position:relative;overflow:hidden
}
.hero:after{
  content:"☻";position:absolute;right:23px;bottom:-35px;
  font:150px Arial,sans-serif;color:#ffffff08;
  transform:rotate(-12deg);pointer-events:none
}
.eyebrow{
  color:var(--gold);font:10px Arial,sans-serif;
  letter-spacing:2.5px;text-transform:uppercase
}
h1{font-size:clamp(29px,5vw,43px);font-weight:normal;
  line-height:1.13;margin:14px 0 10px;letter-spacing:-1px}
.hero p{font-size:15px;color:#d0bdba;line-height:1.6;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:22px}
.stat,.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:12px
}
.stat{padding:17px 19px}
.stat-label{font:11px Arial,sans-serif;color:var(--muted);letter-spacing:.5px}
.stat-number{display:block;font:30px Arial,sans-serif;margin-top:9px;color:var(--gold)}
.panel{padding:23px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}
h2{font-size:19px;font-weight:normal;margin:0}
.count{font:11px Arial,sans-serif;color:var(--gold);background:#3a292e;padding:7px 10px;border-radius:20px}
.form{display:grid;grid-template-columns:minmax(0,1fr) 135px 135px auto;gap:9px;margin-bottom:17px}
input,select{
  width:100%;min-width:0;height:43px;padding:0 11px;
  background:#191619;color:var(--cream);border:1px solid var(--border);
  border-radius:7px;outline:none
}
input::placeholder{color:#897b80}
input:focus,select:focus{border-color:var(--gold)}
select option{background:#211c20}
.btn{
  height:43px;padding:0 16px;background:var(--red);
  color:white;border:1px solid var(--red);border-radius:7px;
  font:12px Arial,sans-serif;letter-spacing:.3px
}
.btn:hover{background:var(--red2)}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1}
.toolbar select{width:155px}
.task-list{display:flex;flex-direction:column;gap:9px}
.task{
  display:flex;align-items:center;gap:12px;
  padding:14px 12px;border:1px solid var(--border);
  border-radius:8px;background:#1d191d
}
.task:hover{border-color:#64404a}
.check{
  appearance:none;flex:0 0 19px;width:19px;height:19px;
  padding:0;border:1px solid #8b777f;border-radius:4px;cursor:pointer
}
.check:checked{background:var(--red);border-color:var(--red)}
.check:checked:after{content:"✓";display:block;text-align:center;color:white;font:14px Arial;line-height:17px}
.task-main{flex:1;min-width:0}
.task-title{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.task.done .task-title{text-decoration:line-through;color:#8b8084}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font:10px Arial,sans-serif;letter-spacing:.2px;padding:5px 8px;border-radius:4px;background:#32282e;color:#d4c1c4}
.high{background:#512c34;color:#ffb8bd}
.medium{background:#413626;color:#e5c992}
.low{background:#253b31;color:#a8d9bb}
.actions{display:flex;gap:3px}
.icon-btn{
  width:33px;height:33px;border:0;border-radius:6px;
  background:transparent;color:var(--muted);font:18px Arial
}
.icon-btn:hover{background:#382b31;color:var(--gold)}
.icon-btn.delete:hover{color:#ff969e}
.empty{text-align:center;padding:43px 12px;color:var(--muted);font:12px Arial,sans-serif}
.empty-icon{font-size:32px;color:var(--gold);margin-bottom:12px}
.empty strong{display:block;color:var(--cream);font:normal 19px Georgia;margin-bottom:8px}
.footer{text-align:center;color:#897c81;font:10px Arial,sans-serif;letter-spacing:.5px;margin-top:18px}
.toast{
  position:fixed;right:20px;bottom:20px;padding:12px 17px;
  border:1px solid #65404a;border-radius:8px;background:#302329;
  color:var(--cream);font:12px Arial,sans-serif;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s
}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:720px){
  .app{padding:22px 13px 35px}
  .hero{padding:24px 19px}
  .stats{gap:8px}
  .stat{padding:14px 11px}
  .stat-number{font-size:25px}
  .panel{padding:17px 12px}
  .form{grid-template-columns:1fr 1fr}
  .form input:first-child{grid-column:1/-1}
  .form .btn{width:100%}
}
@media(max-width:430px){
  .brand-name{font-size:16px}
  .date{max-width:105px;font-size:10px}
  .toolbar{flex-direction:column}
  .toolbar select{width:100%}
  .task{gap:8px;padding:12px 8px}
  .icon-btn{width:28px}
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="smiley" aria-hidden="true">☻</div>
      <div>
        <div class="brand-name">THE MENTALIST</div>
        <span class="brand-sub">PERSONAL CASEBOOK</span>
      </div>
    </div>
    <div class="date" id="date"></div>
  </header>

  <section class="hero">
    <div class="eyebrow">Your mind. Your method.</div>
    <h1>Observe. Deduce.<br>Complete.</h1>
    <p>Every task leaves a clue. Find your focus.</p>
  </section>

  <section class="stats">
    <div class="stat"><span class="stat-label">TOTAL CASES</span><strong class="stat-number" id="total">0</strong></div>
    <div class="stat"><span class="stat-label">SOLVED</span><strong class="stat-number" id="done">0</strong></div>
    <div class="stat"><span class="stat-label">OPEN CASES</span><strong class="stat-number" id="pending">0</strong></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Case files</h2>
      <span class="count" id="count">0 tasks</span>
    </div>

    <form class="form" id="form">
      <input id="taskName" maxlength="200" placeholder="Add a new task..." required aria-label="Task name">
      <select id="category" aria-label="Category">
        <option>Personal</option><option>Work</option><option>Study</option><option>Health</option><option>Other</option>
      </select>
      <select id="priority" aria-label="Priority">
        <option value="Low">Low priority</option>
        <option value="Medium" selected>Medium priority</option>
        <option value="High">High priority</option>
      </select>
      <button class="btn" id="submit" type="submit">+ Add case</button>
    </form>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search case files..." aria-label="Search tasks">
      <select id="filter" aria-label="Task filter">
        <option value="All">All cases</option><option value="Pending">Open cases</option><option value="Completed">Solved cases</option>
      </select>
    </div>

    <div class="task-list" id="list"></div>
    <div class="footer">KEEP YOUR EYES OPEN · YOUR PROGRESS IS SAVED AUTOMATICALLY</div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = "mentalistCasebook_v1";
const $ = id => document.getElementById(id);
let tasks = load();
let editing = null;
let toastTimer;

$("date").textContent = new Date().toLocaleDateString(undefined,{
  weekday:"long",month:"short",day:"numeric",year:"numeric"
});

function load(){
  try{
    const data = JSON.parse(localStorage.getItem(KEY) || "[]");
    return Array.isArray(data) ? data.filter(t =>
      t && typeof t.id === "string" &&
      typeof t.title === "string" &&
      typeof t.completed === "boolean"
    ) : [];
  }catch{return []}
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(tasks));
    return true;
  }catch{
    notify("Unable to save. Check browser storage.");
    return false;
  }
}

function notify(message){
  const toast=$("toast");
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
}

function updateStats(){
  const finished=tasks.filter(t=>t.completed).length;
  $("total").textContent=tasks.length;
  $("done").textContent=finished;
  $("pending").textContent=tasks.length-finished;
}

function tag(text,cls=""){
  const el=document.createElement("span");
  el.className="tag"+(cls?" "+cls:"");
  el.textContent=text;
  return el;
}

function action(symbol,label,cls,fn){
  const b=document.createElement("button");
  b.type="button";
  b.className="icon-btn "+cls;
  b.textContent=symbol;
  b.title=label;
  b.setAttribute("aria-label",label);
  b.addEventListener("click",fn);
  return b;
}

function render(){
  const q=$("search").value.trim().toLowerCase();
  const filter=$("filter").value;
  const visible=tasks.filter(t=>{
    const match=(t.title+" "+t.category+" "+t.priority).toLowerCase().includes(q);
    const state=filter==="All" ||
      (filter==="Pending"&&!t.completed) ||
      (filter==="Completed"&&t.completed);
    return match&&state;
  });

  $("list").replaceChildren();
  $("count").textContent=visible.length+(visible.length===1?" task":" tasks");

  if(!visible.length){
    const box=document.createElement("div");
    box.className="empty";
    const icon=document.createElement("div");
    icon.className="empty-icon";
    icon.textContent=q||filter!=="All"?"⌕":"☻";
    const title=document.createElement("strong");
    title.textContent=q||filter!=="All"?"No matching cases":"The casebook is empty";
    const message=document.createElement("div");
    message.textContent=q||filter!=="All"?"Try another search.":"Add your first task to get started.";
    box.append(icon,title,message);
    $("list").append(box);
  }else{
    visible.forEach(t=>{
      const row=document.createElement("article");
      row.className="task"+(t.completed?" done":"");

      const check=document.createElement("input");
      check.type="checkbox";
      check.className="check";
      check.checked=t.completed;
      check.setAttribute("aria-label","Complete "+t.title);
      check.addEventListener("change",()=>{
        t.completed=check.checked;
        save();
        render();
      });

      const main=document.createElement("div");
      main.className="task-main";
      const title=document.createElement("div");
      title.className="task-title";
      title.textContent=t.title;
      const meta=document.createElement("div");
      meta.className="meta";
      meta.append(tag(t.category));
      meta.append(tag(t.priority+" priority",t.priority.toLowerCase()));
      main.append(title,meta);

      const actions=document.createElement("div");
      actions.className="actions";
      actions.append(action("✎","Edit task","edit",()=>{
        editing=t.id;
        $("taskName").value=t.title;
        $("category").value=t.category;
        $("priority").value=t.priority;
        $("submit").textContent="Save case";
        $("taskName").focus();
        $("taskName").scrollIntoView({behavior:"smooth",block:"center"});
      }));
      actions.append(action("×","Delete task","delete",()=>{
        if(!confirm("Remove this case file?"))return;
        tasks=tasks.filter(x=>x.id!==t.id);
        if(editing===t.id)reset();
        save();
        render();
        notify("Case file removed.");
      }));

      row.append(check,main,actions);
      $("list").append(row);
    });
  }
  updateStats();
}

function reset(){
  editing=null;
  $("form").reset();
  $("priority").value="Medium";
  $("submit").textContent="+ Add case";
}

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const title=$("taskName").value.trim();
  if(!title){$("taskName").focus();return;}

  if(editing){
    const task=tasks.find(t=>t.id===editing);
    if(task){
      task.title=title;
      task.category=$("category").value;
      task.priority=$("priority").value;
    }
    notify("Case file updated.");
  }else{
    tasks.unshift({
      id:Date.now().toString(36)+Math.random().toString(36).slice(2),
      title,
      category:$("category").value,
      priority:$("priority").value,
      completed:false,
      createdAt:new Date().toISOString()
    });
    notify("New case added.");
  }
  save();
  reset();
  render();
  $("taskName").focus();
});

$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);
render();
</script>
</body>
</html>
